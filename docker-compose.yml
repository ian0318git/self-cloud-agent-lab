# self-cloud-agent-lab — 第一階段：Ollama + Open WebUI
#
# 設計前提：這是在 GitHub Codespaces 免費額度內運作的「驗證用」堆疊。
# 額度是有限的（2-core 機器每月 60 真實小時），因此本檔案刻意：
#   1. 不對外發布 Ollama 埠（Ollama 無任何認證機制）
#   2. 限制 Ollama 同時載入的模型數與平行度，降低 OOM 風險
#   3. 透過 healthcheck 確保 Open WebUI 只在 Ollama 就緒後才啟動

services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped

    # 注意：這裡刻意「不」發布 11434 埠。
    # Ollama 沒有任何認證機制，任何能觸及該埠的人都可以讀取、刪除、推送模型。
    # open-webui 透過下方的 ai-net 網路以 http://ollama:11434 直達，無需對外暴露。
    # 若真的需要從 codespace 主機除錯，請改用：
    #   docker compose exec ollama ollama list
    # 或暫時取消下列註解（僅綁定 loopback）：
    # ports:
    #   - "127.0.0.1:11434:11434"

    environment:
      # 以下三個值都是為「2-core / 8GB codespace」調的，因此全部走 .env，
      # 不寫死。搬到大機器時這三個數字就是第一個該放大的地方 ——
      # 寫死會讓「換 VPS 只要改 .env」這件事變成「換 VPS 要改 compose」，
      # 而後者會讓改動散進版控、變得難以回溯。
      #
      # 同時只載入一個模型，避免在 8GB 機器上把記憶體吃光
      - OLLAMA_MAX_LOADED_MODELS=${OLLAMA_MAX_LOADED_MODELS:-1}
      # 單一平行請求，降低 KV cache 佔用的記憶體。
      # 有餘裕的機器放大這個值可顯著提升吞吐（多個請求共用一次載入）。
      - OLLAMA_NUM_PARALLEL=${OLLAMA_NUM_PARALLEL:-1}
      # 模型閒置多久後卸載；額度有限時縮短可釋放記憶體。
      # 機器夠大時設 -1 可讓模型常駐，省下每次對話的重載時間。
      - OLLAMA_KEEP_ALIVE=${OLLAMA_KEEP_ALIVE:-5m}

      # 推論的 context 長度（token）。這是**伺服器端的預設值**，也是
      # mem0 唯一吃得到的旋鈕 —— 它的 OllamaLLM 從頭到尾不送 num_ctx
      # （llms/ollama.py:129-134 只送 temperature／num_predict／top_p），
      # 所以 Open WebUI 那個「每則對話的 num_ctx 參數」到不了抽取呼叫。
      #
      # 預設值刻意留 4096（= ollama 自己的預設），所以這一行對既有環境
      # 是 no-op；要開大請改 .env 的 OLLAMA_CONTEXT_LENGTH。
      #
      # 為什麼要開大：mem0 的 ADDITIVE_EXTRACTION_PROMPT 實測 8,052 與
      # 8,100 個 token，而截斷規則是 `num_ctx >= prompt tokens + 1`
      # （D-027）。4096 之下只有 2,050 進得去，**被丟掉的是開頭與中段，
      # 也就是模型自己的指令** —— 付了一樣的錢，拿到的是讀不到指令的呼叫。
      # 要完整需要 >= 8101。
      #
      # 代價：KV cache 隨 num_ctx 線性成長。**本堆疊沒有實測過這個代價**
      # （D-022 的 ~36 KiB/token 是從 Qwen2.5-3B 架構推得的估算值），
      # 所以只想著「數字大就是好」的話，先確認機器的記憶體。
      - OLLAMA_CONTEXT_LENGTH=${OLLAMA_CONTEXT_LENGTH:-4096}

    volumes:
      - ollama_storage:/root/.ollama

    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

    networks:
      - ai-net

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    restart: unless-stopped

    # ── 為什麼要自己指定 DNS ──────────────────────────────────
    # 這不是效能調校，是**修一個會讓 Kaggle 那條路整條不通的故障**。
    #
    # 2026-09-24 實測：`connect-endpoint.sh` 的相容性探針在容器內回
    #     URLError: <urlopen error [Errno -2] Name or service not known>
    # 而**同一個網址用原始 IP ＋ SNI 直接連是 200 OK**（模型清單正常）。
    # 所以 runtime 沒壞，是解析壞了。
    #
    # 根因不在 Docker：本機 systemd-resolved 轉發到 NAT 閘道 192.168.44.2，
    # 閘道的上游是 ISP 的 117.102.159.254，而它對 `*.trycloudflare.com`
    # 回 **NXDOMAIN** —— 與「確定不存在的名字」回的同一個 status。
    # 1.1.1.1 與 8.8.8.8 都解得出來。`*.trycloudflare.com` 常被用來做釣魚，
    # 有些 ISP 的解析器直接濾掉；而 endpoint 的 tunnel 正好就是這個網域。
    #
    # 指定在這裡而不是改主機的 resolver：範圍限定在這個 lab（不影響同機其他
    # 用途）、跟著 repo 走（Codespaces 與別台機器一樣受益），而且重開機與
    # 容器重建都不會失效。代價是**容器不再繼承主機 DNS**，所以將來若這個 lab
    # 需要解析僅內網可見的名字（公司內部服務、.local），要把它加進這份清單。
    dns:
      - 1.1.1.1
      - 8.8.8.8

    # 綁定位址刻意做成可設定的，因為**這個值的正確答案取決於機器在哪**：
    #
    #   Codespaces：0.0.0.0 是安全的。那裡的埠預設為私有，要通過 GitHub
    #               認證才連得到，不會直接暴露到 Internet。
    #   自己的 VPS：0.0.0.0 **不安全**。VPS 若有公開 IP 且沒有防火牆，
    #               3000 埠就是對全世界開放 —— 而且它會**繞過**你另外架設的
    #               Cloudflare Access（Access 保護的是經過 tunnel 的那條路，
    #               不是這個埠）。掃到 3000 的人不需要經過 Access。
    #
    # 搬到 VPS 時請在 .env 設 WEBUI_BIND_ADDR=127.0.0.1，只留 tunnel 那條路。
    # 用 scripts/check-exposure.sh 可以隨時機械檢查目前實際綁在哪裡。
    ports:
      - "${WEBUI_BIND_ADDR:-0.0.0.0}:3000:8080"

    environment:
      - OLLAMA_BASE_URL=http://ollama:11434

      # ── OpenAI-compatible runtime（可替換的 LLM Runtime）──────
      # 這是「上層不需要知道底下是哪一個 runtime」的接點：Open WebUI 用
      # OpenAI 協定接上任何相容的推論服務（自架的 vLLM、Kaggle + Endpoint、
      # 或 Ollama 自己的 /v1 端點）。搬家時換的是這裡的網址，不是程式碼。
      #
      # ⚠ 為什麼 ENABLE_OPENAI_API 的預設值是 false —— 這不是保守，是修錯：
      #
      #   Open WebUI 的原始碼（backend/open_webui/config.py）裡，
      #   OPENAI_API_BASE_URLS 的預設值是空字串，而空字串**不是「關閉」**，
      #   是 fallback —— 空清單會被填成 ['https://api.openai.com/v1']：
      #
      #       OPENAI_API_BASE_URLS = os.getenv('OPENAI_API_BASE_URLS', '')
      #       OPENAI_API_BASE_URLS = (OPENAI_API_BASE_URLS
      #                               if OPENAI_API_BASE_URLS != ''
      #                               else OPENAI_API_BASE_URL)   # 預設也是空
      #       OPENAI_API_BASE_URLS = [u.strip() if u != ''
      #                               else 'https://api.openai.com/v1'
      #                               for u in OPENAI_API_BASE_URLS.split(';')]
      #
      #   而 ENABLE_OPENAI_API 的預設是 **True**。兩者相加的結果是：
      #   一個「資料不出公司」的堆疊，預設就連上了 OpenAI 官方 API，
      #   而且模型會出現在使用者的選單裡。更麻煩的是 OPENAI_API_KEY 是
      #   很多開發機上**全域匯出**的環境變數 —— 一旦有，gpt-4o 就能被
      #   選中，公司資料在**沒有任何人在這個專案裡設定過**的情況下送出去。
      #
      #   這與 ENABLE_MCP（不存在的變數）、ENABLE_SIGNUP（只第一次開機
      #   有效）是同一類：看起來是關的，其實不是。所以這裡把**真正的開關**
      #   明寫出來，預設關閉。
      #
      # 要接上自架 runtime 時，在 .env 設定：
      #     ENABLE_OPENAI_API=true
      #     OPENAI_API_BASE_URLS=http://your-runtime:8000/v1   ← 非空才會
      #                                                           涵蓋掉上面的預設
      #     OPENAI_API_KEYS=...                                ← 沒有就留空
      # 然後用 bash scripts/probe-openai.sh <url> 驗證相容性。
      - ENABLE_OPENAI_API=${ENABLE_OPENAI_API:-false}
      - OPENAI_API_BASE_URLS=${OPENAI_API_BASE_URLS:-}
      - OPENAI_API_KEYS=${OPENAI_API_KEYS:-}

      # 必填。Open WebUI 用它加密儲存 MCP 的 OAuth token；
      # 未設定時每次容器重建都會出現 "Error decrypting tokens"，
      # 導致 MCP 工具連線失效。由 scripts/up.sh 自動產生。
      - WEBUI_SECRET_KEY=${WEBUI_SECRET_KEY:?WEBUI_SECRET_KEY 未設定，請先執行 scripts/up.sh 或複製 .env.example 為 .env}

      # 註：這裡原本有一行 ENABLE_MCP。**那個環境變數不存在。**
      # Open WebUI 自 v0.6.31 起原生支援 MCP，但啟用方式是
      # Admin → External Tools 新增 MCP (Streamable HTTP) 連線，設定寫進
      # 資料庫，不是環境變數。設一個不存在的變數只會讓人以為已經開了。
      # 相關的環境變數只有 MCP_INITIALIZE_TIMEOUT（握手逾時，預設 10 秒）。

      # 是否開放註冊。**只在第一次開機、資料庫還是空的時候有效** —— 之後
      # Open WebUI 把設定寫進資料庫，改這裡再重建容器完全沒有作用（實測，
      # 見 DECISIONS.md D-012）。要確認真實現況請執行：
      #     bash scripts/lock-signup.sh --check
      #
      # 這裡的預設值只是最後一道防線（.env 通常已提供此值）。放 false 是
      # 安全的：已實測確認它不會擋住第一位管理員的建立。
      - ENABLE_SIGNUP=${ENABLE_SIGNUP:-false}

      - DO_NOT_TRACK=true
      - SCARF_NO_ANALYTICS=true
      - ANONYMIZED_TELEMETRY=false

    volumes:
      - open_webui_storage:/app/backend/data

    depends_on:
      ollama:
        condition: service_healthy

    healthcheck:
      # open-webui 映像檔保證有 python，用標準庫檢查 /health 以免依賴 curl
      test:
        - "CMD"
        - "python"
        - "-c"
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8080/health', timeout=3).status==200 else 1)"
      interval: 15s
      timeout: 5s
      retries: 5
      # start_period 要涵蓋「首次開機」的額外工作：Open WebUI 在啟動序列中
      # 就會下載預設嵌入模型 sentence-transformers/all-MiniLM-L6-v2（約 90MB），
      # 下載完成前 /health 不會回應。在這段期間失敗的檢查不計入 retries。
      #
      # 實測（2026-09-19，慢速 HF 連線）：啟動到 healthy 約 100–110 秒，
      # 而原本 30s + 5×15s = 105s 的預算剛好卡在邊界上 —— `up.sh` 的
      # --wait 因此回報 "container open-webui is unhealthy" 而失敗，
      # 但服務其實完全正常，只是還在抓模型。那是本專案最不想出現的
      # 「假失敗」：叫人去查一個不存在的問題。
      #
      # 180s 讓預算變成 180 + 75 = 255 秒，足以涵蓋慢速連線。
      start_period: 180s

    networks:
      - ai-net

  # ── 測試用 MCP server（第二階段 MCP 清單）────────────────
  # 唯一目的：讓「Admin → External Tools 新增 MCP (Streamable HTTP)」
  # 有現成的東西可以接。兩個工具（echo、roll_die）分別對應 MCP 清單的
  # 基本呼叫與多輪測試（見 README 第二階段 MCP 一節）。
  #
  # 刻意不發布埠 —— 與 ollama 同一個思路：open-webui 經 ai-net 內網直達
  # http://mcp-test-server:8000/mcp，主機與外界都碰不到（D-003）。
  # 驗證完第二階段 MCP 清單後，刪掉這個服務與 mcp-server/ 目錄即可。
  mcp-test-server:
    build: ./mcp-server
    container_name: mcp-test-server
    restart: unless-stopped

    # 只檢查「埠有在聽」。streamable-http 對 GET /mcp 的回應不是 200，
    # 所以不能照 open-webui 那樣用 urllib 驗 HTTP 狀態 —— 那會製造假失敗
    # （D-006 同一類：healthcheck 本身的錯誤把人送去修不存在的問題）。
    healthcheck:
      test:
        - "CMD"
        - "python"
        - "-c"
        - "import socket; socket.create_connection(('127.0.0.1', 8000), 3).close()"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    networks:
      - ai-net

  # ── Cloudflare Tunnel（選用，第二階段的對外連線）────────
  # 讓 Open WebUI 透過你自己的網域對外，並由 Cloudflare Access 控管身分。
  # 這條路線由容器「對外」建立連線，因此不需要發布任何埠，也不需要
  # Codespaces 的埠轉送 —— 與上面 ollama 不發布埠是同一個思路。
  #
  # 啟用方式：在 .env 設定 CLOUDFLARE_TUNNEL_TOKEN 與 COMPOSE_PROFILES=tunnel，
  # 再執行 bash scripts/up.sh。未啟用時這個服務完全不會被建立。
  #
  # 注意：這裡刻意不用 ${VAR:?} 驗證 token —— compose 會對整個檔案做變數
  # 插值，即使 profile 沒啟用也會觸發，反而讓沒用 tunnel 的人起不來。
  # 缺 token 的檢查改由 scripts/up.sh 執行。
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    restart: unless-stopped
    profiles: ["tunnel"]
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN:-}

    # 刻意不設 healthcheck：cloudflared 的就緒端點需要額外的 metrics 旗標，
    # 設錯會讓容器反覆重啟，反而比沒有 healthcheck 更難診斷（見 D-006）。
    # 需要確認狀態時看日誌：docker compose logs --tail=20 cloudflared

    depends_on:
      open-webui:
        condition: service_healthy

    networks:
      - ai-net

volumes:
  ollama_storage:
  open_webui_storage:

networks:
  ai-net:
    driver: bridge
